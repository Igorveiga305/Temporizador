<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Temporizador</title>
</head>
<body>
    
    <main>

        <div class="temporizador">
            <h2 class="contador" id="contagem"> 00:00:00:000</h2>
        </div>
        <div class="botoes">
            <button type="button" id="restart"><i class="fa-solid fa-rotate"></i></button>
            <button type="button" id="power" action="start"><i class="fa-solid fa-play"></i></button>
            <button type="button" id="mark"><i class="fa-solid fa-flag"></i></button>
        </div>
        <div class="marcadores" id="markslist"></div>
    </main>

    <!--Link com Javascript-->
    <script src="script.js"></script>
</body>
</html>
